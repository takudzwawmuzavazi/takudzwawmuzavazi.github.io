<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takudzwa Wilson Muzavazi</title>
<meta name="description" content="Takudzwa Wilson Muzavazi: GIS and remote sensing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-width aerial video hero. The header floats over its top edge and a
   poster-style title stretches across the upper part of the footage, with its small line above. */
:root {
  --basalt: #142028;      /* page ground, deep blue-slate */
  --basalt-2: #1c2c36;    /* raised surfaces */
  --glacier: #e6edf0;     /* main text */
  --mist: #aebfc8;        /* secondary text */
  --flag: #ff8a3d;        /* survey-marker orange, the one accent */
  --fog: rgba(214, 226, 214, 0.74);  /* soft sage mist for the big title, lets the forest show through */
  --line: rgba(230, 237, 240, 0.16);

  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --poster: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;

  --wrap: 1320px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--basalt); }
body {
  margin: 0;
  background: var(--basalt);
  color: var(--glacier);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img, video { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--flag); outline-offset: 3px; border-radius: 2px; }

.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  height: min(88vh, 860px);
  min-height: 520px;
  overflow: hidden;
  background: var(--basalt-2);
  isolation: isolate;
}
.hero video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.6s ease;
}
.hero video.on { opacity: 1; }
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(14, 22, 28, 0.78) 0%, rgba(14, 22, 28, 0.45) 30%, rgba(14, 22, 28, 0) 58%),
    linear-gradient(to top, rgba(14, 22, 28, 0.45) 0%, rgba(14, 22, 28, 0) 25%);
}

/* header floats on the video */
.top {
  position: absolute;
  z-index: 3;
  top: 0;
  left: 0;
  right: 0;
}
.top .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding-block: calc(1.1rem + env(safe-area-inset-top, 0px)) 1.1rem;
}
.brand {
  text-decoration: none;
  min-width: 0;
  font-family: var(--display);
  font-weight: 650;
  font-size: 1.08rem;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.brand small {
  display: block;
  font-family: var(--body);
  font-weight: 400;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--mist);
}
.nav { display: flex; align-items: center; gap: 0.25rem; }
.nav > a, .menu-parent {
  text-decoration: none;
  padding: 0.5rem 0.85rem;
  font: inherit;
  font-size: 0.95rem;
  color: var(--glacier);
  opacity: 0.8;
  background: none;
  border: 0;
  cursor: pointer;
}
.nav > a:hover, .menu-parent:hover, .nav > a[aria-current="page"] { opacity: 1; }
.menu-parent span { font-size: 0.7em; margin-left: 0.15rem; }
.has-menu { position: relative; }
.submenu {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 11rem;
  padding: 0.4rem 0;
  background: var(--basalt-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 14px 30px rgba(5, 12, 16, 0.45);
}
.has-menu:hover .submenu, .has-menu:focus-within .submenu, .has-menu.open .submenu { display: block; }
.submenu a { display: block; padding: 0.6rem 1.1rem; text-decoration: none; color: var(--glacier); font-size: 0.95rem; }
.submenu a:hover { background: rgba(230, 237, 240, 0.06); }
.nav .cta {
  margin-left: 0.5rem;
  opacity: 1;
  background: var(--flag);
  color: var(--basalt);
  font-weight: 600;
  border-radius: 999px;
}
.nav .cta:hover { filter: brightness(1.06); }

.menu-btn {
  display: none;
  font: inherit;
  font-size: 0.9rem;
  color: var(--glacier);
  background: rgba(20, 32, 40, 0.35);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.45rem 1rem;
  cursor: pointer;
}

@media (max-width: 820px) {
  .menu-btn { display: block; }
  .nav {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    align-items: stretch;
    background: var(--basalt);
    border-bottom: 1px solid var(--line);
    padding: 0.5rem max(20px, env(safe-area-inset-right, 0px)) 1rem max(20px, env(safe-area-inset-left, 0px));
  }
  .nav.open { display: flex; }
  .nav > a, .menu-parent { padding: 0.75rem 0; opacity: 1; text-align: left; }
  .menu-parent { pointer-events: none; }
  .menu-parent span { display: none; }
  .submenu { display: block; position: static; min-width: 0; padding: 0 0 0 1rem; background: none; border: 0; border-left: 2px solid var(--line); border-radius: 0; box-shadow: none; }
  .submenu a { padding: 0.55rem 0; }
  .nav .cta { margin: 0.5rem 0 0; text-align: center; padding: 0.75rem 1rem; }
}

/* statement: centred near the top, poster style */
.statement {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  top: calc(clamp(5.5rem, 13vh, 8.5rem) + env(safe-area-inset-top, 0px));
  text-align: center;
}
.statement .lede {
  margin: 0 auto 0.4rem;
  max-width: 34ch;
  font-family: var(--body);
  font-weight: 600;
  font-size: clamp(1rem, 1.8vw, 1.35rem);
  line-height: 1.3;
  color: var(--fog);
  text-wrap: balance;
}
.statement h1 {
  margin: 0;
  font-family: var(--poster);
  font-weight: 900;
  font-size: clamp(3rem, 12vw, 13.5rem);
  line-height: 0.88;
  white-space: nowrap;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  color: var(--fog);
  text-shadow: 0 2px 40px rgba(10, 18, 24, 0.25);
}
.statement h1 span { color: var(--flag); opacity: 0.85; }
@media (max-width: 600px) {
  .statement h1 { white-space: normal; font-size: 23vw !important; line-height: 0.86; }
}

/* ---------- Footer ---------- */
.foot .wrap {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.75rem 2rem;
  padding-block: 1.25rem 2rem;
  font-size: 0.85rem;
  color: var(--mist);
}
.foot .wrap { align-items: center; }
.foot p { margin: 0; }
.socials { list-style: none; margin: 0; padding: 0; display: flex; gap: 0.6rem; }
.socials a {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--fog);
  transition: color 0.2s, border-color 0.2s, background-color 0.2s;
}
.socials a:hover { color: var(--basalt); background: var(--flag); border-color: var(--flag); }
.socials svg { width: 18px; height: 18px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.foot a { color: var(--glacier); }

@media (prefers-reduced-motion: reduce) {
  .hero video { transition: none; }
}
</style>
</head>
<body>
<main>
  <section class="hero" id="hero" aria-label="Aerial footage">
    <video muted playsinline loop preload="auto" poster="images/pine-forest-poster.jpg" data-src="videos/pine-forest.mp4" aria-hidden="true"></video>
    <video muted playsinline loop preload="none" poster="images/red-gully-poster.jpg" data-src="videos/red-gully.mp4" aria-hidden="true"></video>
    <video muted playsinline loop preload="none" poster="images/river-forest-poster.jpg" data-src="videos/river-forest.mp4" aria-hidden="true"></video>
    <video muted playsinline loop preload="none" poster="images/farmland-clouds-poster.jpg" data-src="videos/farmland-clouds.mp4" aria-hidden="true"></video>
    <video muted playsinline loop preload="none" poster="images/forest-canopy-poster.jpg" data-src="videos/forest-canopy.mp4" aria-hidden="true"></video>

    <header class="top">
      <div class="wrap">
        <a class="brand" href="index.html">Takudzwa Wilson Muzavazi<small>GIS &amp; Remote Sensing</small></a>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
        <nav class="nav" id="nav" aria-label="Main">
          <a href="index.html" aria-current="page">Home</a>
          <div class="has-menu">
            <button class="menu-parent" type="button" aria-expanded="false">About <span aria-hidden="true">▾</span></button>
            <div class="submenu">
              <a href="about.html">Quick bio</a>
              <a href="cv.html">CV</a>
            </div>
          </div>
          <a href="projects.html">Projects</a>
          <a class="cta" href="contact.html">Get in touch</a>
        </nav>
      </div>
    </header>

    <div class="statement">
      <div class="wrap">
        <p class="lede">Mapping land and measuring change with satellite imagery and spatial analysis</p>
        <h1>Read the land<span>.</span></h1>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p>Takudzwa Wilson Muzavazi · <span id="year">2026</span></p>
    <ul class="socials">
      <li><a href="mailto:twmuzava@mtu.edu" title="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
        <span class="sr-only">Email</span></a></li>
      <li><a href="https://www.linkedin.com/in/wilsonmuzavazi/" target="_blank" rel="noopener" title="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.6 8.65 21 11.2 21 14.4V21h-4v-5.8c0-1.4-.03-3.2-1.95-3.2-1.95 0-2.25 1.5-2.25 3.1V21H9z"/></svg>
        <span class="sr-only">LinkedIn</span></a></li>
      <li><a href="tel:+19063199894" title="Phone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
        <span class="sr-only">Phone</span></a></li>
    </ul>
  </div>
</footer>

<script>
(function () {
  var btn = document.querySelector('.menu-btn');
  var nav = document.getElementById('nav');
  btn.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  document.querySelectorAll('.menu-parent').forEach(function (b) {
    b.addEventListener('click', function () {
      var open = b.parentElement.classList.toggle('open');
      b.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function (e) {
    document.querySelectorAll('.has-menu.open').forEach(function (m) {
      if (!m.contains(e.target)) { m.classList.remove('open'); m.querySelector('.menu-parent').setAttribute('aria-expanded', 'false'); }
    });
  });
  document.getElementById('year').textContent = new Date().getFullYear();

  // rotate the four aerial clips with a slow crossfade
  var videos = [].slice.call(document.querySelectorAll('#hero video'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SCENE_MS = 5000, current = -1;
  function load(v) { if (!v.src) { v.src = v.dataset.src; v.preload = 'auto'; } }
  function show(i) {
    i = i % videos.length;
    var v = videos[i];
    load(v);
    try { v.currentTime = 0; } catch (e) {}
    var p = v.play(); if (p && p.catch) p.catch(function () {});
    videos.forEach(function (x, j) { x.classList.toggle('on', j === i); });
    var prev = current;
    current = i;
    if (prev >= 0 && prev !== i) setTimeout(function () { videos[prev].pause(); }, 1700);
    load(videos[(i + 1) % videos.length]);
    if (!reduce) setTimeout(function () { show(current + 1); }, SCENE_MS);
  }
  show(0);

  // stretch the title to the width of the page, whatever font has loaded
  var title = document.querySelector('.statement h1');
  var box = title.parentElement;
  function fit() {
    title.style.fontSize = '';
    if (window.innerWidth <= 600) return;
    var avail = box.clientWidth - parseFloat(getComputedStyle(box).paddingLeft) - parseFloat(getComputedStyle(box).paddingRight);
    var size = parseFloat(getComputedStyle(title).fontSize);
    var next = Math.min(size * (avail * 0.98) / title.scrollWidth, 216);
    title.style.fontSize = next + 'px';
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fit, 120); });
})();
</script>
</body>
</html>
